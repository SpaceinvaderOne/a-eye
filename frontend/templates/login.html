<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - A-Eye</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/static/css/style.css?v=nocturne1">
    <style>
        .login-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: var(--space-6);
        }
        .login-card {
            position: relative;
            background: var(--bg-elevated);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-lg);
            padding: var(--space-10) var(--space-8);
            width: 100%;
            max-width: 400px;
            box-shadow: var(--shadow-modal);
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: var(--space-6);
            right: var(--space-6);
            height: 1px;
            background: var(--accent);
            opacity: 0.9;
        }
        .login-header {
            text-align: center;
            margin-bottom: var(--space-8);
        }
        .login-header img {
            display: block;
            margin: 0 auto var(--space-3);
        }
        .login-header h1 {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin: 0;
        }
        .login-field {
            margin-bottom: var(--space-4);
        }
        .login-field label {
            display: block;
            font-family: var(--font-mono);
            font-size: 0.62rem;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: var(--space-2);
        }
        .login-field input {
            width: 100%;
            padding: 0.65rem 0.85rem;
            background: var(--bg-input);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-family: var(--font-body);
            font-size: 0.9rem;
            outline: none;
            transition: border-color var(--dur) var(--ease),
                        box-shadow var(--dur) var(--ease),
                        background var(--dur) var(--ease);
        }
        .login-field input:focus {
            border-color: var(--accent);
            background: var(--bg-elevated);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .login-btn {
            width: 100%;
            margin-top: var(--space-2);
            padding: 0.75rem;
            background: var(--accent);
            color: var(--accent-ink);
            border: 1px solid var(--accent);
            border-radius: var(--radius-sm);
            font-family: var(--font-display);
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background var(--dur) var(--ease),
                        border-color var(--dur) var(--ease);
        }
        .login-btn:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
        }
        .login-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
        .login-error {
            background: var(--error-bg);
            border: 1px solid var(--border);
            border-left: 2px solid var(--error);
            color: var(--error);
            padding: 0.6rem 0.85rem;
            border-radius: var(--radius-sm);
            font-family: var(--font-body);
            font-size: 0.8rem;
            margin-bottom: var(--space-4);
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <img src="/static/a-eye-logo.png" alt="" height="48">
                <h1>A-Eye</h1>
            </div>

            <div class="login-error" id="login-error"></div>

            <form id="login-form" onsubmit="return doLogin(event)">
                <div class="login-field">
                    <label for="login-user">Username</label>
                    <input type="text" id="login-user" name="username" autocomplete="username" autofocus required>
                </div>
                <div class="login-field">
                    <label for="login-pass">Password</label>
                    <input type="password" id="login-pass" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="login-btn" id="login-btn">Sign In</button>
            </form>
        </div>
    </div>

    <script>
    function doLogin(e) {
        e.preventDefault();
        var btn = document.getElementById('login-btn');
        var errEl = document.getElementById('login-error');
        var user = document.getElementById('login-user').value;
        var pass = document.getElementById('login-pass').value;

        btn.disabled = true;
        btn.textContent = 'Signing in\u2026';
        errEl.style.display = 'none';

        fetch('/api/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: user, password: pass})
        }).then(function(resp) {
            if (resp.ok) {
                window.location.href = '/';
            } else {
                return resp.json().then(function(data) {
                    errEl.textContent = data.detail || 'Invalid credentials';
                    errEl.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Sign In';
                });
            }
        }).catch(function() {
            errEl.textContent = 'Connection error. Please try again.';
            errEl.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Sign In';
        });

        return false;
    }
    </script>
</body>
</html>
